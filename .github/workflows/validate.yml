name: Validazione

# Per le card HACS controlla la categoria "plugin": hassfest non si applica,
# perche' non c'e' un componente Python da validare.
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Controlli HACS
        uses: hacs/action@main
        with:
          category: plugin
